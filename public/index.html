<!DOCTYPE html>
<html>
<head>
    <title>ConfCam</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>
<header id="header">
    <h1>ConfCam</h1>
</header>
<hsplit>
    <panel>
        <scroll id="controls">
            <table id="stats">
                <tr>
                    <th>Framerate</th>
                    <td><span id="stat-drm"></span>/<span id="stat-fps"></span></td>
                    <th>Camera ID</th>
                    <td id="stat-camid"></td>
                </tr>
                <tr>
                    <th>Sensor</th>
                    <td id="stat-sensor"></td>
                    <th>CPU</th>
                    <td id="stat-temp"></td>
                </tr>
            </table>
        </scroll>
    </panel>
    <iframe src="/cam/"></iframe>
</hsplit>
<script src="/js/misirka.min.js"></script>
<script src="/js/control.js"></script>
</body>
</html>
